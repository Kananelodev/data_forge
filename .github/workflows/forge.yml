name: Strike the forge

# Runs when YOU change learning files. The board/map/state it commits back are
# not in this list, so the bot's own commit never re-triggers the game.
on:
  push:
    paths:
      - "solutions/**"
      - "journal/**"
      - "gates/**"
      - "quests/**"
      - "forge/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take a turn
        id: turn
        run: python -m forge.update

      - name: Commit the new board
        env:
          HEADLINE: ${{ steps.turn.outputs.headline }}
        run: |
          git config user.name  "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git add README.md assets/forge_map.svg state/progress.json
          if git diff --cached --quiet; then
            echo "Board unchanged."
          else
            git commit -m "⚒️ ${HEADLINE} [skip ci]"
            git push
          fi
